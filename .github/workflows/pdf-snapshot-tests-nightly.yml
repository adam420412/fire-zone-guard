name: Kanban PDF — Nightly Regression

# Nocny strażnik regresji eksportu Kanban PDF.
# Uruchamia pełną regresję NIEZALEŻNIE od zmian w kodzie:
#   - łapie regresje wynikające z aktualizacji zależności (np. jspdf, vitest)
#   - łapie niedeterminizm (daty, TZ, fonty), który nie wyjdzie w PR
#   - daje świeży raport HTML/JUnit każdej nocy do przeglądu
#
# Cron: codziennie 02:17 UTC (03:17 / 04:17 Europe/Warsaw, poza godzinami szczytu CI).
# `workflow_dispatch` pozwala wymusić ręcznie z UI GitHuba.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: pdf-snapshots-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kanban-pdf-export-nightly:
    name: Kanban PDF export — nightly full regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      TZ: "Europe/Warsaw"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run pełna regresja Kanban PDF (nightly)
        run: |
          mkdir -p reports/kanban-pdf-export-nightly
          bunx vitest run \
            --reporter=verbose \
            --reporter=junit --outputFile.junit=reports/kanban-pdf-export-nightly/junit.xml \
            --reporter=html --outputFile.html=reports/kanban-pdf-export-nightly/index.html \
            --passWithNoTests=false \
            src/test/kanbanPdfExport.test.ts \
            src/test/kanbanPdfExport.snapshot.test.ts \
            src/test/kanbanPdfExport.multipage.test.ts \
            src/test/kanbanPdfExport.edgecases.test.ts \
            src/test/kanbanPdfExport.boundaries.test.ts \
            src/test/kanbanPdfExport.pageFormats.e2e.test.ts \
            src/test/kanbanPdfExport.diagnostics.test.ts \
            src/test/kanbanLayoutDiff.test.ts \
            src/test/kanbanLayoutCompare.test.ts \
            src/test/kanbanLayoutExport.test.ts \
            src/test/pdfExportPerf.test.ts

      - name: Wymuś brak niezatwierdzonych zmian w snapshotach
        run: |
          if ! git diff --exit-code -- 'src/test/__snapshots__/**'; then
            echo "::error::Nightly: snapshoty PDF różnią się od repo (możliwa regresja w zależnościach)."
            exit 1
          fi

      - name: Upload Vitest reports (HTML + JUnit) — nightly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-kanban-pdf-export-nightly
          path: |
            reports/kanban-pdf-export-nightly/**
            html/**
          if-no-files-found: warn
          retention-days: 30

      - name: Podpowiedź naprawy
        if: failure()
        run: |
          echo "::warning::Nightly Kanban PDF NIE przeszedł — sprawdź artefakt 'vitest-report-kanban-pdf-export-nightly'."
          echo "::warning::Najczęstsze przyczyny w nocnym runie:"
          echo "::warning::  • aktualizacja zależności (jspdf, vitest, jsdom) zmieniła układ"
          echo "::warning::  • niedeterminizm dat/TZ — sprawdź testy używające new Date()"
          echo "::warning::  • flaky perf — sprawdź pdfExportPerf.test.ts"
