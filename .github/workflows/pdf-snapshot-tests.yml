name: PDF Layout Snapshot Tests

# Strażnik regresji układu eksportu PDF Kanban.
# CI MUSI się wywalić, jeżeli:
#   - układ snapshotu się zmienił bez aktualizacji pliku .snap (`vitest -u` lokalnie),
#   - istnieją obsolete snapshoty (zostały po usuniętych testach),
#   - jakikolwiek test PDF się nie powiódł.
#
# UWAGA: vitest w trybie CI z definicji NIE zapisuje nowych snapshotów
# (zachowanie domyślne — patrz `process.env.CI`), więc wystarczy nie podawać `-u`.

on:
  push:
    branches: [main]
    paths:
      - "src/lib/kanbanPdfExport.ts"
      - "src/lib/kanbanLayoutCompare.ts"
      - "src/lib/kanbanLayoutExport.ts"
      - "src/lib/pdfExportPerf.ts"
      - "src/test/kanbanPdfExport*.test.ts"
      - "src/test/kanbanLayout*.test.ts"
      - "src/test/pdfExportPerf.test.ts"
      - "src/test/__snapshots__/**"
      - "src/test/utils/kanbanLayoutDiff.ts"
      - "src/test/setup/kanbanLayoutMatcher.ts"
      - "src/pages/KanbanPage.tsx"
      - "src/components/kanban/PdfLayoutDebugDialog.tsx"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/pdf-snapshot-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/lib/kanbanPdfExport.ts"
      - "src/lib/kanbanLayoutCompare.ts"
      - "src/lib/kanbanLayoutExport.ts"
      - "src/lib/pdfExportPerf.ts"
      - "src/test/kanbanPdfExport*.test.ts"
      - "src/test/kanbanLayout*.test.ts"
      - "src/test/pdfExportPerf.test.ts"
      - "src/test/__snapshots__/**"
      - "src/test/utils/kanbanLayoutDiff.ts"
      - "src/test/setup/kanbanLayoutMatcher.ts"
      - "src/pages/KanbanPage.tsx"
      - "src/components/kanban/PdfLayoutDebugDialog.tsx"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/pdf-snapshot-tests.yml"
  workflow_dispatch:

concurrency:
  group: pdf-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Snapshoty PDF (regresja wizualna układu).
  # Lekki, deterministyczny — odpala się przy KAŻDEJ zmianie pasującej do paths.
  # ─────────────────────────────────────────────────────────────────────────
  pdf-snapshots:
    name: Vitest PDF snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CI: "true"
      # Wymuś jednolity TZ — niektóre dane testowe operują na datach.
      TZ: "Europe/Warsaw"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run PDF layout + snapshot tests (CI mode, no auto-update)
        # `--reporter=verbose` ułatwia czytanie diffa naszego custom matchera.
        # `--passWithNoTests=false` zabezpiecza przed pomyłkami w pathach.
        run: |
          bunx vitest run \
            --reporter=verbose \
            --passWithNoTests=false \
            src/test/kanbanPdfExport.test.ts \
            src/test/kanbanPdfExport.snapshot.test.ts \
            src/test/kanbanPdfExport.multipage.test.ts \
            src/test/kanbanPdfExport.edgecases.test.ts \
            src/test/kanbanLayoutDiff.test.ts

      - name: Wykryj obsolete snapshoty
        # Po przejściu testów uruchamiamy ponownie z flagą reporting.
        # Jeśli któryś plik .snap zawiera nieużywane snapshoty, vitest zwraca exit != 0.
        # Dzięki temu zapominane snapshoty nie zostają w repo „na zawsze”.
        run: bunx vitest run --reporter=default src/test/kanbanPdfExport.snapshot.test.ts src/test/kanbanPdfExport.edgecases.test.ts

      - name: Wymuś brak niezatwierdzonych zmian w snapshotach
        # Jeżeli mimo CI=true coś zmodyfikowało pliki .snap, build pada z czytelnym komunikatem.
        run: |
          if ! git diff --exit-code -- 'src/test/__snapshots__/**'; then
            echo "::error::Snapshoty PDF zostały zmodyfikowane podczas runa CI."
            echo "::error::Uruchom lokalnie 'bun run test:snapshots:update', zweryfikuj diff i scommituj nowe snapshoty."
            exit 1
          fi

      - name: Podpowiedź naprawy (na wypadek wcześniejszego falla)
        if: failure()
        run: |
          echo "::warning::Jeden z testów snapshotu PDF NIE przeszedł."
          echo "::warning::1) Sprawdź diff w logach (custom matcher 'KanbanPdfLayout DIFF')."
          echo "::warning::2) Jeśli zmiana układu jest INTENCJONALNA: lokalnie uruchom"
          echo "::warning::   bun run test:snapshots:update"
          echo "::warning::   i scommituj zaktualizowane pliki w src/test/__snapshots__/."
          echo "::warning::3) W przeciwnym razie napraw regresję w src/lib/kanbanPdfExport.ts."

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Pełna regresja kanbanPdfExport (E2E formaty papieru, granice,
  # diagnostyka, eksport layout JSON, perf, compare). Ten job zawsze patrzy
  # na CAŁY moduł eksportu PDF — odpala się tylko, gdy zmieni się którykolwiek
  # plik z modułu lub jego testów (paths-filter przez `on.<event>.paths` powyżej).
  # Jest niezależny od JOB 1 — falla jednego nie blokuje runu drugiego, dzięki
  # czemu w PR widać dokładnie, która warstwa się popsuła.
  # ─────────────────────────────────────────────────────────────────────────
  kanban-pdf-export-suite:
    name: Kanban PDF export — pełna regresja
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: []

    env:
      CI: "true"
      TZ: "Europe/Warsaw"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run pełna regresja Kanban PDF (snapshoty + boundaries + E2E formaty + diagnostics + perf)
        run: |
          bunx vitest run \
            --reporter=verbose \
            --passWithNoTests=false \
            src/test/kanbanPdfExport.test.ts \
            src/test/kanbanPdfExport.snapshot.test.ts \
            src/test/kanbanPdfExport.multipage.test.ts \
            src/test/kanbanPdfExport.edgecases.test.ts \
            src/test/kanbanPdfExport.boundaries.test.ts \
            src/test/kanbanPdfExport.pageFormats.e2e.test.ts \
            src/test/kanbanPdfExport.diagnostics.test.ts \
            src/test/kanbanLayoutDiff.test.ts \
            src/test/kanbanLayoutCompare.test.ts \
            src/test/kanbanLayoutExport.test.ts \
            src/test/pdfExportPerf.test.ts

      - name: Podpowiedź naprawy
        if: failure()
        run: |
          echo "::warning::Pełna regresja Kanban PDF NIE przeszła."
          echo "::warning::Zidentyfikuj warstwę:"
          echo "::warning::  • snapshot/multipage/edgecases  → zmiana układu (snapshoty)"
          echo "::warning::  • boundaries                    → puste grupy / długie opisy / skrajne kolumny"
          echo "::warning::  • pageFormats.e2e               → różne formaty papieru / orientacje"
          echo "::warning::  • diagnostics                   → kontrakt diagnostics=false (pages=[], totals=0)"
          echo "::warning::  • layoutCompare/Export          → API porównania / serializacji raportu"
          echo "::warning::  • pdfExportPerf                 → store metryk wydajności eksportu"
